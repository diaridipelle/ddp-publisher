name: Rinnova token Instagram

on:
  schedule:
    - cron: "0 6 * * 1"     # ogni lunedi' mattina
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rinnova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests openpyxl

      - name: Allungo il token di altri 60 giorni
        run: python ddp_publisher.py ig-refresh --config config.json

      - name: Salvo il token rinnovato
        run: |
          git config user.name "Publisher automatico"
          git config user.email "actions@github.com"
          git add token_instagram.txt
          git diff --staged --quiet || git commit -m "Token Instagram rinnovato"
          git push || true
