name: Rinnova token Instagram

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  rinnova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests openpyxl
      - name: Allungo il token
        env:
          TOKEN_INSTAGRAM: ${{ secrets.TOKEN_INSTAGRAM }}
        run: python ddp_publisher.py ig-refresh --config config.json
