name: Programma Facebook (mensile)

on:
  schedule:
    - cron: "0 7 1 * *"      # il primo di ogni mese, 7:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  programma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests openpyxl

      - name: Programmo il mese su Facebook
        env:
          TOKEN_FACEBOOK: ${{ secrets.TOKEN_FACEBOOK }}
        run: |
          python ddp_publisher.py build --config config.json
          python ddp_publisher.py sync --config config.json
          python ddp_publisher.py fb-batch --config config.json --days 29

      - name: Salvo il registro
        run: |
          git config user.name "Publisher automatico"
          git config user.email "actions@github.com"
          git add state.json queue.json || true
          git diff --staged --quiet || git commit -m "Programmazione mensile Facebook"
          git push || true
